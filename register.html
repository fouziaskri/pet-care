<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pet Care Tracker - Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-lang">
      <div class="lang-switch">
        <button class="lang-btn active" onclick="setLang('en')">EN</button>
        <button class="lang-btn" onclick="setLang('tr')">TR</button>
      </div>
    </div>
    <div class="auth-logo">
      <span class="paw">🐾</span>
      <h1>Pet Care Tracker</h1>
      <p data-key="tagline">Take care of your furry friends</p>
    </div>
    <h2 data-key="createAccountTitle">Create Account</h2>
    <div id="message" class="message" style="display:none;"></div>
    <div class="form-group">
      <label data-key="fullName">Full Name</label>
      <input type="text" id="fullname" placeholder="Enter your full name" />
    </div>
    <div class="form-group">
      <label data-key="username">Username</label>
      <input type="text" id="username" placeholder="Choose a username" />
    </div>
    <div class="form-group">
      <label data-key="password">Password</label>
      <input type="password" id="password" placeholder="Choose a password" />
    </div>
    <div class="form-group">
      <label data-key="confirmPassword">Confirm Password</label>
      <input type="password" id="confirm" placeholder="Confirm your password" />
    </div>
    <button class="btn btn-primary" onclick="register()" data-key="registerBtn">Create Account</button>
    <button class="btn btn-secondary" onclick="goToLogin()" data-key="backToLogin">Already have an account</button>
  </div>
  <script src="js/lang.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
